<style>
  :root {
    color-scheme: light;
    --bg: #F1F2EE;
    --surface: #FAFBF8;
    --surface-raised: #FFFFFF;
    --ink: #242720;
    --ink-soft: #62665D;
    --line: rgba(36,39,32,0.13);
    --line-soft: rgba(36,39,32,0.07);
    --accent: #C9A227;
    --accent-ink: #2B2118;
    --error: #A12D23;
    --danger: #B13E36;
    --shadow: 0 8px 24px rgba(28,31,27,0.07);
    --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius-panel: 10px;
    --radius-control: 8px;
    --texture-opacity: 0.035;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111315; --surface: #191C1F; --surface-raised: #22262A;
      --ink: #F1F0EA; --ink-soft: #B7B7AF;
      --error: #FF8A80;
      --danger: #FF8A80;
      --line: rgba(241,240,234,0.14); --line-soft: rgba(241,240,234,0.08);
      --shadow: 0 8px 24px rgba(0,0,0,0.28); --texture-opacity: 0.04;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111315; --surface: #191C1F; --surface-raised: #22262A;
    --ink: #F1F0EA; --ink-soft: #B7B7AF;
    --error: #FF8A80;
    --danger: #FF8A80;
    --line: rgba(241,240,234,0.14); --line-soft: rgba(241,240,234,0.08);
    --shadow: 0 8px 24px rgba(0,0,0,0.28); --texture-opacity: 0.04;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  button, input { touch-action: manipulation; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  body {
    position: relative; min-height: 100%;
    background-image: radial-gradient(circle at 1px 1px, rgba(36,39,32,var(--texture-opacity)) 1px, transparent 0);
    background-size: 18px 18px;
  }
  .app { max-width: 1080px; margin: 0 auto; padding: 24px 24px 64px; }
  .skip-link { position: fixed; top: 8px; left: 8px; z-index: 60; padding: 10px 14px; background: var(--surface-raised); color: var(--ink); border: 2px solid var(--accent); border-radius: var(--radius-control); transform: translateY(-150%); }
  .skip-link:focus { transform: translateY(0); }
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px);
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .title-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .title-wrap h1 { margin: 0; }
  .title-input {
    font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1.05;
    background: transparent; border: none; color: var(--ink); padding: 2px 0; max-width: 60vw;
  }
  .title-input:focus { border-bottom: 2px solid var(--accent); }
  .couple-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .tabbar { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .tab { border: none; background: transparent; color: var(--ink-soft); font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 7px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease; }
  .icon-btn:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, a:focus-visible, [tabindex="-1"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, .filter-pill, .tab, .radio-pill, .owner-pill, .ghost-btn, .btn-primary, .btn-text { min-height: 44px; }
  button:active { transform: scale(0.98); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-pill {
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink);
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .filter-pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .filter-pill.selected { background: var(--ink); color: var(--surface); border-color: var(--ink); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); box-shadow: var(--shadow); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .cal-nav .month-label { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
  .cal-nav-btns { display: flex; gap: 8px; align-items: center; }
  .ghost-btn { border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); border-radius: var(--radius-control); padding: 7px 12px; font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; }
  .ghost-btn:hover { border-color: var(--accent); }
  .arrow-btn { width: 44px; height: 44px; border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-raised); cursor: pointer; color: var(--ink); font-size: 17px; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 8px 0; }
  .weekday-row span { text-align: center; color: var(--ink-soft); font-size: 11px; font-weight: 600; }
  .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; padding: 8px; }
  .day-cell { min-height: 88px; border-radius: var(--radius-control); border: 1px solid var(--line-soft); padding: 7px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; background: var(--surface-raised); color: var(--ink); font: inherit; text-align: left; transition: border-color 160ms ease, transform 160ms ease, background-color 160ms ease; }
  .day-cell.outside { opacity: 0.35; }
  .day-cell:hover { border-color: var(--accent); transform: translateY(-1px); }
  .day-cell.today { border-color: var(--accent); border-width: 1.5px; }
  .day-num { font-size: 13px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .day-cell.today .day-num { color: var(--ink); font-weight: 700; }
  .chip { font-size: 11px; padding: 2px 6px; border-radius: 6px; color: #FBF6EA; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-more { font-size: 10.5px; color: var(--ink-soft); padding-left: 4px; }

  .goals-card { padding: 18px; }
  .goals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .goals-header h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0; }
  .goals-scroll { overflow-x: auto; padding-bottom: 6px; }
  .goals-timeline { position: relative; }
  .month-ticks { position: relative; height: 26px; border-bottom: 1px solid var(--line); margin-left: 160px; }
  .month-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-soft); padding-left: 6px; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .goal-row { display: flex; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line-soft); }
  .goal-label { width: 160px; flex: none; padding: 0 10px 0 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; text-align: left; }
  .goal-label .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .goal-track { position: relative; flex: 1; height: 100%; }
  .goal-bar { position: absolute; top: 10px; height: 26px; border-radius: var(--radius-control); overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .goal-bar .fill { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(255,255,255,0.35); }
  .goal-bar .pct { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 10.5px; color: #FBF6EA; font-weight: 700; font-variant-numeric: tabular-nums; }
  .today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); z-index: 2; opacity: 0.6; }
  .empty-note { padding: 30px 10px; text-align: center; color: var(--ink-soft); font-size: 14px; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.28); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 88vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgba(0,0,0,0.18); transform: translateX(100%); transition: transform 0.25s ease; z-index: 41; padding: calc(env(safe-area-inset-top,0px) + 20px) 20px 20px; overflow-y: auto; overscroll-behavior: contain; }
  .panel.open { transform: translateX(0); }
  .panel h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 4px; }
  .panel .panel-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 18px; }
  .field-group { margin-bottom: 22px; }
  .field-group > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
  .partner-block { border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 12px; margin-bottom: 12px; }
  .partner-block input[type="text"] { width: 100%; padding: 8px 9px; border-radius: var(--radius-control); border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); font-family: var(--font-body); font-size: 16px; margin-bottom: 10px; }
  .partner-block input[type="text"]:focus { border-color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 44px; height: 44px; padding: 7px; background-clip: content-box; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch.selected { border-color: var(--ink); }
  .color-input { width: 44px; height: 44px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: none; }
  .radio-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-pill { border: 1px solid var(--line); background: var(--surface-raised); padding: 7px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; color: var(--ink); }

<body>
<main class="app" id="mainContent" tabindex="-1">
  <a class="skip-link" href="#mainContent">Skip to planner</a>

  <header class="top">
    <div class="title-wrap">

</main>

<div class="backdrop" id="backdrop"></div>
<div class="panel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsHeading" tabindex="-1" inert aria-hidden="true">

  </div>

  </div>
</div>

<div class="modal-backdrop" id="dayModalBackdrop" inert aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle" tabindex="-1">
    <h2 id="dayModalTitle">Day</h2>
    <div class="modal-sub">Add what's happening.</div>
    <div class="existing-list" id="dayExistingList"></div>

</div>

<div class="modal-backdrop" id="goalModalBackdrop" inert aria-hidden="true">

      <button class="btn-text" id="deleteGoalBtn" style="display:none;">Delete goal</button>

    </div>
  </div>
</div>

      var merged = Object.assign(JSON.parse(JSON.stringify(defaultState)), parsed);

    } catch (e) { return JSON.parse(JSON.stringify(defaultState)); }

  function saveState() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toISODate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISODate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }

  var MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function ownerColor(owner) {
    var p1 = state.partners[0].color, p2 = state.partners[1].color;
    if (owner === 'p1') return p1;

  function ownerLabel(owner) {
    if (owner === 'p1') return state.partners[0].name;

  }

  function colorLuminance(hex) {
    var match = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!match) return 0.5;
    var channels = match[1].match(/.{2}/g).map(function (value) { return parseInt(value, 16) / 255; });
    var rgb = channels.map(function (value) { return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4); });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }
  function contrastRatio(foreground, background) {
    var a = colorLuminance(foreground), b = colorLuminance(background);
    return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
  }
  function readableTextColor(backgrounds) {
    var colors = Array.isArray(backgrounds) ? backgrounds : [backgrounds];
    var dark = colorLuminance('#242720'), light = colorLuminance('#F7F6F0');
    function minContrast(foreground) { return Math.min.apply(null, colors.map(function (color) { return contrastRatio(foreground === dark ? '#242720' : '#F7F6F0', color); })); }
    return minContrast(dark) >= minContrast(light) ? '#242720' : '#F7F6F0';
  }
  function contrastSafeColor(background, foreground) {
    if (contrastRatio(foreground, background) >= 4.5) return background;
    var match = /^#?([0-9a-f]{6})$/i.exec(background);
    if (!match) return background;
    var channels = match[1].match(/.{2}/g).map(function (value) { return parseInt(value, 16); });
    var target = foreground === '#242720' ? 255 : 0;
    for (var step = 1; step <= 100; step++) {
      var candidate = '#' + channels.map(function (value) { return Math.round(value + (target - value) * step / 100).toString(16).padStart(2, '0'); }).join('');
      if (contrastRatio(foreground, candidate) >= 4.5) return candidate;
    }
    return background;
  }
  function ownerPresentation(owner) {
    var colors = owner === 'both' ? [state.partners[0].color, state.partners[1].color] : [owner === 'p1' ? state.partners[0].color : state.partners[1].color];
    var text = readableTextColor(colors);
    var safe = colors.map(function (color) { return contrastSafeColor(color, text); });
    return { background: safe.length === 1 ? safe[0] : 'linear-gradient(90deg, ' + safe[0] + ' 50%, ' + safe[1] + ' 50%)', color: text };

  }

  function renderAccentPicker(container, selectedValue, onPick) {

    customWrap.appendChild(custom);
    container.appendChild(customWrap);

  // ---------- Export to Calendar (.ics) ----------
  function escapeICS(text) {
    return String(text).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }
  function icsStampUTC() {
    var d = new Date();
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
      pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }
  function ymd(dateStr) { return dateStr.replace(/-/g, ''); }
  function addDaysStr(dateStr, n) {
    var d = parseISODate(dateStr);
    d.setDate(d.getDate() + n);
    return toISODate(d);
  }
  function buildICS() {
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Our Planner//EN', 'CALSCALE:GREGORIAN'];
    var stamp = icsStampUTC();

    Object.keys(state.events).forEach(function (dateKey) {
      state.events[dateKey].forEach(function (ev) {
        lines.push('BEGIN:VEVENT');
        lines.push('UID:' + ev.id + '@our-planner');
        lines.push('DTSTAMP:' + stamp);
        if (ev.time) {
          var hm = ev.time.split(':');
          var startDT = ymd(dateKey) + 'T' + pad(Number(hm[0])) + pad(Number(hm[1])) + '00';
          var endDate = parseISODate(dateKey);
          var endDT = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate(), Number(hm[0]), Number(hm[1]));
          endDT.setHours(endDT.getHours() + 1);
          var endStr = endDT.getFullYear() + pad(endDT.getMonth() + 1) + pad(endDT.getDate()) + 'T' +
            pad(endDT.getHours()) + pad(endDT.getMinutes()) + '00';
          lines.push('DTSTART:' + startDT);
          lines.push('DTEND:' + endStr);
        } else {
          lines.push('DTSTART;VALUE=DATE:' + ymd(dateKey));
          lines.push('DTEND;VALUE=DATE:' + ymd(addDaysStr(dateKey, 1)));
        }
        lines.push('SUMMARY:' + escapeICS(ev.title));
        lines.push('DESCRIPTION:' + escapeICS(ownerLabel(ev.owner)));
        lines.push('END:VEVENT');
      });
    });

    state.goals.forEach(function (g) {
      lines.push('BEGIN:VEVENT');
      lines.push('UID:' + g.id + '@our-planner');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART;VALUE=DATE:' + ymd(g.start));
      lines.push('DTEND;VALUE=DATE:' + ymd(addDaysStr(g.end, 1)));
      lines.push('SUMMARY:' + escapeICS(g.name + ' (goal)'));
      lines.push('DESCRIPTION:' + escapeICS(ownerLabel(g.owner) + ' \u00b7 ' + (g.progress || 0) + '% done'));
      lines.push('END:VEVENT');
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function exportToCalendar() {
    var totalItems = Object.keys(state.events).reduce(function (n, k) { return n + state.events[k].length; }, 0) + state.goals.length;
    if (totalItems === 0) {
      alert('Nothing to export yet \u2014 add a plan or a goal first.');
      return;
    }
    var ics = buildICS();
    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'our-planner.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  document.getElementById('exportBtn').addEventListener('click', exportToCalendar);

  function renderAll() { if (currentTab === 'goals') renderGoals(); else renderCalendar(); }

  applyTheme();
  renderCoupleLegend();
  readUrlState();
  setTab(currentTab, false);
})();
</script>
</body>
</html>
